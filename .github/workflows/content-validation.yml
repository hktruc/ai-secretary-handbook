name: Validate article content
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  editorial-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WHY-before-HOW editorial schema
        run: node scripts/validate-content.cjs
      - name: Check browser JavaScript syntax
        run: |
          node --check draft/content.js
          node --check knowledge.js
