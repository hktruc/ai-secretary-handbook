<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Nguồn và ghi chú cạnh nhau</title><rect width="960" height="540" fill="#edf3f4"/><g font-family="Arial,sans-serif"><text x="55" y="75" font-size="30" fill="#163839">Đọc một ý. Viết lại. Đối chiếu ngay.</text><rect x="55" y="120" width="410" height="300" rx="20" fill="#fff"/><rect x="495" y="120" width="410" height="300" rx="20" fill="#163839"/><text x="85" y="172" font-size="23" fill="#163839">NGUỒN CÔNG KHAI</text><text x="525" y="172" font-size="23" fill="#7ce2be">GHI CHÚ CỦA BẠN</text><g fill="#b9cccd"><rect x="85" y="210" width="340" height="15" rx="5"/><rect x="85" y="250" width="300" height="15" rx="5"/><rect x="85" y="290" width="325" height="15" rx="5"/></g><g fill="#fff" font-size="22"><text x="525" y="230">1. Điều đã hiểu</text><text x="525" y="280">2. Thao tác sẽ thử</text><text x="525" y="330">3. Điều cần kiểm</text></g><text x="55" y="480" fill="#355b5c" font-size="18">Sơ đồ minh họa · Dữ liệu giả · Không phải ảnh chụp Windows</text></g></svg>