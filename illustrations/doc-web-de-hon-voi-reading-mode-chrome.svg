<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Bớt phần gây xao nhãng, giữ nội dung cần đọc</title>
<desc id="desc">Trang nội dung nhiều khối ở bên trái chuyển sang một cột đọc thoáng ở bên phải. Các dòng chữ có khoảng cách rõ; biểu tượng tai nghe nhỏ gợi tùy chọn nghe khi có. Ba điểm cần kiểm là đọc rõ, nghe đúng và giữ nguồn. Đây là sơ đồ khái niệm, không phải giao diện Chrome.</desc>
