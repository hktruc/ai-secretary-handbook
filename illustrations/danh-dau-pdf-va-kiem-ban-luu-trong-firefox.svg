<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Đọc, lưu, mở lại</title>
<desc id="desc">Sơ đồ minh họa ba chặng: tô một câu và ghi chú, lưu PDF thành bản riêng, mở lại đúng tệp để kiểm dấu và chữ.</desc>
<rect width="960" height="540" rx="24" fill="#f4f1e8"/>
<circle cx="900" cy="20" r="150" fill="#e8e1cf"/>
<g font-family="Arial, sans-serif" fill="#203c44">
<text x="50" y="58" font-size="17" font-weight="700" letter-spacing="2">AI DẠO CHƠI · HỌC TẬP</text>
<text x="50" y="114" font-size="40" font-weight="700">Đọc → lưu → mở lại</text>
<text x="50" y="153" font-size="22">Dấu trên tab chưa đủ. Kiểm trong tệp đã lưu.</text>
<g fill="#fff" stroke="#d1cebf" stroke-width="2">
<rect x="50" y="194" width="250" height="250" rx="18"/>
<rect x="355" y="194" width="250" height="250" rx="18"/>
<rect x="660" y="194" width="250" height="250" rx="18"/>
</g>
<g font-size="22" font-weight="700">
<text x="73" y="233">1 · Đánh dấu</text>
<text x="378" y="233">2 · Lưu bản riêng</text>
<text x="683" y="233">3 · Mở lại</text>
</g>
<g fill="#f8faf8" stroke="#cbd4cf" stroke-width="2">
<rect x="73" y="253" width="204" height="156" rx="7"/>
<rect x="378" y="253" width="204" height="156" rx="7"/>
</g>
<rect x="85" y="278" width="179" height="25" rx="4" fill="#f4df83"/>
<text x="91" y="296" font-size="16">Mang một cuốn sách.</text>
<text x="88" y="340" font-size="16" fill="#397855">Có cần ghi tên</text>
<text x="88" y="364" font-size="16" fill="#397855">sách trước không?</text>
<text x="444" y="300" font-size="27" font-weight="700">PDF</text>
<text x="390" y="341" font-size="17">tai-lieu-</text>
<text x="390" y="368" font-size="17">da-danh-dau.pdf</text>
<g fill="#dfefe2">
<rect x="683" y="263" width="204" height="54" rx="8"/>
<rect x="683" y="333" width="204" height="54" rx="8"/>
</g>
