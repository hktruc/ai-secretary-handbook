<text x="697" y="297">✓ Còn dấu tô</text>
<text x="697" y="367">✓ Chữ đọc rõ</text>
</g>
<path d="M311 325h31m-10-10 10 10-10 10 M616 325h31m-10-10 10 10-10 10" fill="none" stroke="#397855" stroke-width="4"/>
<text x="50" y="483" font-size="23" font-weight="700">Giữ bản gốc để đối chiếu.</text>
<text x="50" y="519" font-size="14" fill="#69756d">SƠ ĐỒ · DỮ LIỆU GIẢ · KHÔNG PHẢI GIAO DIỆN FIREFOX · AI DẠO CHƠI · 09/11/2026</text>
</g>
</svg>
