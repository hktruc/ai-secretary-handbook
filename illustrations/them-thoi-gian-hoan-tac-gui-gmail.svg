<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Thêm thời gian hoàn tác gửi Gmail</title><desc id="desc">Đặt khoảng hủy, bấm Undo ngay, rồi kiểm bản nháp. Ngoài khoảng hủy không bảo đảm lấy lại thư. Sơ đồ minh họa, không phải ảnh giao diện.</desc><rect width="960" height="540" fill="#eef4f1"/><g font-family="sans-serif"><text x="60" y="65" font-size="16" fill="#276759" letter-spacing="2">AI DẠO CHƠI · SƠ ĐỒ MINH HỌA</text><text x="60" y="125" font-size="38" font-weight="700" fill="#142d35">Dừng lại trước khi gửi tiếp</text><path d="M150 255H810" stroke="#589482" stroke-width="5"/><g fill="#fff" stroke="#276759" stroke-width="2"><rect x="60" y="185" width="250" height="150" rx="20"/><rect x="355" y="185" width="250" height="150" rx="20"/><rect x="650" y="185" width="250" height="150" rx="20"/></g><g fill="#142d35" text-anchor="middle"><text x="185" y="240" font-size="25">1. Đặt khoảng hủy</text><text x="185" y="285" font-size="20">5 / 10 / 20 / 30 giây</text><text x="480" y="240" font-size="25">2. Bấm Undo ngay</text><text x="480" y="285" font-size="20">Sau khi bấm Gửi</text><text x="775" y="240" font-size="25">3. Kiểm bản nháp</text><text x="775" y="285" font-size="20">Chưa gửi lại vội</text></g><rect x="60" y="380" width="840" height="65" rx="12" fill="#f7e6d4"/><text x="480" y="420" text-anchor="middle" font-size="22" fill="#77431a">Ngoài khoảng hủy: không bảo đảm lấy lại thư.</text><text x="60" y="495" font-size="16" fill="#57736d">Ví dụ thư giả gửi cho chính mình · Minh họa nguyên bản · 08/11/2026</text></g></svg>
